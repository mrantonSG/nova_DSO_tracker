  image_url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e0/Euclid%E2%80%99s_view_of_spiral_galaxy_IC_342_ESA25170723.jpg/960px-Euclid%E2%80%99s_view_of_spiral_galaxy_IC_342_ESA25170723.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail

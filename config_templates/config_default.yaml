  image_url: https://upload.wikimedia.org/wikipedia/commons/thumb/d/d9/NGC_5286_hlsp_acsggct_hst_acs-wfc_R606_hst_13297_B336.png/960px-NGC_5286_hlsp_acsggct_hst_acs-wfc_R606_hst_13297_B336.png
  image_credit: Own work (CC BY-SA 3.0) via Wiki
  image_source_link: https://en.wikipedia.org/wiki/NGC%205286
  description_text: 'NGC 5286 (also known as Caldwell 84) is a globular cluster of
    stars located some 35,900 light years away in the constellation Centaurus. At
    this distance, the light from the cluster has undergone reddening from interstellar
    gas and dust equal to E(B – V) = 0.24 magnitude in the UBV photometric system.
    The cluster lies 4 arc-minutes north of the naked-eye star M Centauri. It was
    discovered by Scottish astronomer James Dunlop, active in Australia, and listed
    in his 1827 catalog.

    This cluster is about 29 kly (8.9 kpc) from the Galactic Center and is currently
    orbiting in the Milky Way halo. It may be associated with the Monoceros Ring—a
    long tidal stream of stars that could have been formed from a disrupted dwarf
    galaxy. NGC 5286 may be one of the oldest globular clusters in the galaxy, with
    an estimated age of 12.54 billion years. It is not perfectly spherical, but has
    a projected ellipticity of 0.12.

    The velocity dispersion of stars at the center of the cluster is (8.1 ± 1.0) km/s.
    Based upon the motions of stars at the core of this cluster, it may host an intermediate
    mass black hole with less than 1% of the cluster''s mass. The upper limit for
    the mass estimate of this object is 6,000 times the mass of the Sun.

    NGC 5286 is part of the Gaia Sausage, the hypothesised remains of a merged dwarf
    galaxy.'
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/NGC%205286

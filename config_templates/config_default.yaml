  image_credit: ESA/Hubble and NASA (CC BY 3.0) via Wiki
  image_source_link: https://en.wikipedia.org/wiki/Messier%2071
  description_text: 'Messier 71 (also known as M71, NGC 6838, or the Angelfish Cluster)
    is a globular cluster in the small northern constellation Sagitta. It was discovered
    by Philippe Loys de Chéseaux in 1745 and included by Charles Messier in his catalog
    of non-comet-like objects in 1780. It was also noted by Koehler at Dresden around
    1775. Messier 71 is also known as NGC 6839, though this identification is very
    uncertain.

    This star cluster is about 13,000 light years away from Earth and spans 27 light-years
    (8 pc). The irregular variable star Z Sagittae is a member.


    M71 was for many decades thought (until the 1970s) to be a densely packed open
    cluster and was classified as such by leading astronomers in the field of star
    cluster research due to its lacking a dense central compression, and to its stars
    having more "metals" than is usual for an ancient globular cluster; furthermore,
    it lacks the RR Lyrae "cluster" variable stars that are common in most globulars.
    However, modern photometric photometry has detected a short "horizontal branch"
    in the H-R diagram (chart of temperature versus luminosity) which is characteristic
    of a globular cluster.  The shortness of the branch explains the lack of RR Lyrae
    variables and is due to the globular''s relatively young age of 9–10 billion years.  Taking
    in many or only late series (Population I) stars explains relatively its stars.  Hence
    today M71 is designated as a very loosely concentrated globular cluster, much
    like M68 in Hydra. M71 has a mass of about 53,000 M☉ and a luminosity of around
    19,000 L☉.'
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/Messier%2071

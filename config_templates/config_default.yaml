  image_source_link: https://en.wikipedia.org/wiki/NGC%203195
  description_text: 'NGC 3195 (also known as Caldwell 109) is a planetary nebula located
    in the southern constellation of Chamaeleon. Discovered by Sir John Herschel in
    1835, this 11.6 apparent magnitude planetary nebula is slightly oval in shape,
    with dimensions of 40×35 arc seconds, and can be seen visually in telescopic apertures
    of 10.5 centimetres (4.1 in) at low magnifications.

    Spectroscopy reveals that NGC 3195 is approaching Earth at 17 kilometres per second
    (11 mi/s), while the nebulosity is expanding at around 40 kilometres per second
    (25 mi/s). The central star is listed as >15.3V or 16.1B magnitude. An analysis
    of Gaia data suggests that the central star is a binary system. Distance is estimated
    at 1.7 kpc.'
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/NGC%203195

  description_text: Sh 2-46 (also known as RCW 158), is an H II region, a glowing
    cloud of ionized hydrogen gas—located in the southern constellation of Serpens.
    Situated approximately 6,000 light-years from Earth, the nebula is notable for
    its red emission caused by the ionization of hydrogen atoms, energized by the
    central runaway star HD 165319 (O9.7Ib). It is an isolated nebula positioned above
    the galactic plane and contains polycyclic aromatic hydrocarbons (PAHs).  It is
    located about 3° west of the Eagle Nebula (Messier 16) and is part of broader
    star-forming activity in the region.

  image_url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/14/NGC_3242_%22Ghost_of_Jupiter%22.png/960px-NGC_3242_%22Ghost_of_Jupiter%22.png?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail
  image_credit: Judy Schmidt (CC BY 2.0) via Wiki
  image_source_link: https://en.wikipedia.org/wiki/NGC%203242
  description_text: 'NGC 3242 is a planetary nebula located  in the constellation
    Hydra. Alternatively, it is known as the Ghost of Jupiter, Eye Nebula or Caldwell
    59. William Herschel discovered the nebula on February 7, 1785, and catalogued
    it as H IV.27. John Herschel observed it from the Cape of Good Hope, South Africa,
    in the 1830s, and numbered it as h 3248, and included it in the 1864 General Catalogue
    as GC 2102; this became NGC 3242 in J. L. E. Dreyer''s New General Catalogue of
    1888.

    This planetary nebula is most frequently called the Ghost of Jupiter, or Jupiter''s
    Ghost due to its similar shape to the planet, but it is also sometimes referred
    to as the Eye Nebula. The nebula measures around two light years long from end
    to end, and contains a central white dwarf with an apparent magnitude of 11. The
    inner layers of the nebula were formed some 1,500 years ago.  The two ends of
    the nebula are marked by FLIERs, lobes of fast moving gas often tinted red in
    false-color pictures. NGC 3242 can easily be observed with amateur telescopes
    and appears bluish-green to most observers. Larger telescopes can distinguish
    the outer halo as well.

    At the center of NGC 3242 is an O-type star with a spectral type of O(H).


    '
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/NGC%203242
- Object: NGC3314

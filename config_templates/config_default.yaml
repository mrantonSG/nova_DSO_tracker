  description_text: 'NGC 6357 is a diffuse nebula near NGC 6334 in the constellation
    Scorpius.  The nebula contains many proto-stars shielded by dark discs of gas,
    and young stars wrapped in expanding "cocoons" or expanding gases surrounding
    these small stars. It is also known as the Lobster Nebula. This nebula was given
    the name War and Peace Nebula by the Midcourse Space Experiment scientists because
    of its appearance, which, in infrared images the bright, western part resembles
    a dove, while the eastern part looks like a skull. A petition by anime fans to
    rename it as the Madokami nebula, due to resemblance with a character, was unsuccessful.

    It is located about 5,500 light years away from Earth. NGC 6357 is connected by
    a filamentary structure to NGC 6334, and the two may form a single complex.'

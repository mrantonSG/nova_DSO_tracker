  image_url: https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Sh2-88_Nebula_from_the_Mount_Lemmon_SkyCenter_Schulman_Telescope_courtesy_Adam_Block.jpg/960px-Sh2-88_Nebula_from_the_Mount_Lemmon_SkyCenter_Schulman_Telescope_courtesy_Adam_Block.jpg
  image_credit: Ngc1535 (CC BY-SA 4.0) via Wiki
  image_source_link: https://en.wikipedia.org/wiki/Sh%202-88
  description_text: 'Sharpless 2-88 or Sh 2-88 is a region including the diffuse nebula
    Sh 2-88A and the two compact knots Sh 2-88B1 and Sh 2-88B2, all of which are associated
    with Vulpecula OB1.

    Sh 2-88A is an HII-type diffuse nebula excited by the type O8 star BD+25°3952.
    Both neutral and ionized gases in Sh 2-88 are between 150 and 410 solar masses
    and the dust mass is about 2 to 9 solar masses. The structure has been interacting
    with a HI interstellar bubble shaped by the stellar winds of BD+25°3952 and the
    blue O8.5II(f) star BD +25°3866. Overall, its actual structure is located 2.4
    kiloparsecs away, at 23 × 15 parsecs in radius. It has a dynamical age of 1.5
    million years, and a mass of 1,300 solar masses. It has an rms electron density
    of 9 cm−3. All separate star forming regions are 1 arcminute in diameter.'
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/Sh%202-88

  image_url: https://upload.wikimedia.org/wikipedia/commons/3/35/Cederblad_214_and_NGC_7822_Nebulae_-_Davidedemartin_6.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled
  image_credit: 'Credit:  Davide De Martin & the ESA/ESO/NASA Photoshop FITS Liberator
    (CC BY 3.0) via Wiki'
  image_source_link: https://en.wikipedia.org/wiki/NGC%207822
  description_text: 'NGC 7822, also known as the Question Mark Nebula, is a young
    star forming complex in the constellation of Cepheus.  The complex encompasses
    the emission region designated Sharpless 171, and the young cluster of stars named
    Berkeley 59.  The complex is believed to be some 800–1000 pc distant, with the
    younger components aged no more than a few million years.  The complex also includes
    one of the hottest stars discovered within 1 kpc of the Sun, namely BD+66 1673,
    which is an eclipsing binary system consisting of an O5V that exhibits a surface
    temperature of nearly 45,000 K and a luminosity about 100,000 times that of the
    Sun.  The star is one of the primary sources illuminating the nebula and shaping
    the complex''s famed pillars of creation-type formations, the elephant trunks.

    Sharpless 2-170, or the Little Rosette Nebula. is located nearby. The two nebulae
    are not related, with NGC 7822 being about 4,600 Light Years away from each other.'
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/NGC%207822
- Object: NGC84
  Common Name: NGC 84
  RA (hours): 0.359308749374
  DEC (degrees): 22.592019511329998

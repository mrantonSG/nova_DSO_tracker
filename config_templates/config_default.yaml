  image_url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/10/Planetary_nebula_NGC_2899_%28heic2505d%29.jpg/960px-Planetary_nebula_NGC_2899_%28heic2505d%29.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail
  image_credit: NASA, ESA, STScI (CC BY 4.0) via Wiki
  image_source_link: https://en.wikipedia.org/wiki/NGC%202899
  description_text: 'NGC 2899 is a planetary nebula in the southern constellation
    of Vela. It was discovered by English astronomer John Herschel on February 27,
    1835. This nebula can be viewed with a moderate-sized amateur telescope, but requires
    a larger telescope to resolve details. NGC 2899 is located at a distance of 3,350
    ± 670 light-years (1,026 ± 205 pc) from the Sun and 25,894 ± 3 light-years (7,939
    ± 1 pc) from the Galactic Center.

    This nebula has an overall kidney shape that is elongated along an axis from WNW
    to ESE. The overall topology is bipolar with a significant equatorial structure.
    This shape is believed to result from a binary star system. The mean expansion
    rate is 43 to 56 km/s, with high velocity structures expanding at 110 to 130 km/s.
    The core mass of the central star is estimated as ~1.2 M☉.

    The nebula lies within a large cavity in the surrounding medium. This opening
    has quadrupolar shape with a physical dimension of 14 pc × 11 pc. The elongation
    lies along a position angle of 37°±5°, which is aligned with the minor axis of
    the planetary nebula. This opening was most likely crafted by a fast stellar wind
    coming from the central star during its asymptotic giant branch stage, prior to
    the formation of a planetary nebula. The shape and filamentary structures suggest
    the interaction of a binary star system.'
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/NGC%202899
- Object: NGC2903
  Common Name: Barred Galaxy in Leo
  RA (hours): 9.536141944444445
  DEC (degrees): 21.500830555555552

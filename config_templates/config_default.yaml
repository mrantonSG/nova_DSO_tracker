  image_url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6e/Hubble_view_of_NGC_3314_-_Heic1208a.tif/lossy-page1-960px-Hubble_view_of_NGC_3314_-_Heic1208a.tif.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail
  image_credit: Credit:NASA, ESA, the Hubble Heritage (STScI/AURA)-ESA/Hubble Collaboration,
    and W. Keel (University of Alabama) (Public domain) via Wiki
  image_source_link: https://en.wikipedia.org/wiki/NGC%203314
  description_text: 'NGC 3314 is a pair of overlapping spiral galaxies in the constellation
    of Hydra. The pair was discovered by British astronomer John Herschel on 24 March
    1835. Herschel and others did not realize that what appeared to be a single galaxy,
    is actually two galaxies in the same line of sight.


    The unique alignment of both spiral galaxies gives astronomers the opportunity
    to measure the properties of interstellar dust in the face-on foreground galaxy
    (NGC 3314a). The dust appears as dark blue against the background galaxy (NGC
    3314b).  Unlike interacting galaxies, the two components of NGC 3314 are physically
    unrelated, and are too distant from one another to interact.

    In a March 2000 observation of the galaxies, a prominent green star-like object
    was seen in one of the arms of one of the galaxies. Astronomers theorized that
    it could have been a supernova, but the unique filtering properties of the foreground
    galaxy made it difficult to decide definitively. NGC 3314a has its spiral arms
    and copious amounts of dust obscuring the background galaxy NGC 3314b.

    A dust tail can also be seen from NGC 3314a, being a sign of Ram Pressure stripping
    caused by NGC 3314a rushing through the ICM of its home cluster, the Hydra Cluster.
    Both of the galaxies are members of the Hydra Cluster.'
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/NGC%203314

  image_source_link: https://en.wikipedia.org/wiki/NGC%204945
  description_text: 'NGC 4945 is a widely-studied barred spiral galaxy in the constellation
    Centaurus, visible near the optical double star Xi Centauri. It is also known
    as Caldwell 83. The galaxy was discovered by Scottish astronomer James Dunlop
    in 1826. It is located at a distance of approximately 11.0 million light-years
    (3.36 Mpc) from the Milky Way. NGC 4945 hosts one of the closest active galactic
    nuclei to Earth and is classified as a Seyfert 2 galaxy.

    NGC 4945 is one of the brightest galaxies of the Centaurus A/M83 Group, a large,
    nearby group of galaxies. The galaxy is the second brightest galaxy in the subgroup
    centered on Centaurus A.'
  description_credit: Wikipedia

  description_text: 'NGC 147 (also known as DDO3 or Caldwell 17) is a dwarf spheroidal
    galaxy about 2.58 Mly away in the constellation Cassiopeia.  NGC 147 is a member
    of the Local Group of galaxies and a satellite galaxy of the Andromeda Galaxy
    (M31).  It forms a physical pair with the nearby galaxy NGC 185,

    another remote satellite of M31.  It was discovered by John Herschel in September
    1829.  Visually it is both fainter and slightly larger than NGC 185 (and therefore
    has a considerably lower surface brightness).  This means that NGC 147 is more
    difficult to see than NGC 185, which is visible in small telescopes. In the Webb
    Society Deep-Sky Observer''s Handbook,  the visual appearance of NGC 147 is described
    as follows:


    Large, quite faint, irregularly round; it brightens in the middle to a stellar
    nucleus.


    The membership of NGC 147 in the Local Group was confirmed by Walter Baade in
    1944 when he was able to resolve the galaxy into individual stars with the 100-inch
    (2.5 m) telescope at Mount Wilson near Los Angeles.'
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/NGC%20147

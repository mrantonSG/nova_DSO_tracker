- Object: NGC281
  Common Name: Packman Nebula
  RA (hours): 0.8736388888888889
  DEC (degrees): 56.565
  Type: HII
  Constellation: Cas
  Magnitude: '17.57'
  Size: '35.0'
  SB: '25.03'
  catalog_info: null
  image_url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5b/PacMan_Nebula%2C_NGC_281.jpg/960px-PacMan_Nebula%2C_NGC_281.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail
  image_credit: Chuck Ayoub (CC BY-SA 4.0) via Wiki
  image_source_link: https://en.wikipedia.org/wiki/NGC%20281
  description_text: 'NGC 281, IC 11 or Sh2-184 is a bright emission nebula and part
    of an H II region in the northern constellation of Cassiopeia and is part of the
    Milky Way''s Perseus Spiral Arm. This 20×30 arcmin sized nebulosity is also associated
    with open cluster IC 1590, several Bok globules and the multiple star, B 1. It
    collectively forms Sh2-184, spanning over a larger area of 40 arcmin. A recent
    distance from radio parallaxes of water masers at 22 GHz made during 2014 is estimated
    it lies 2.82±0.20 kpc (9200 ly) from us. Colloquially, NGC 281 is also known as
    the Pacman Nebula for its resemblance to the video game character.

    Edward Emerson Barnard discovered the nebula in August 1883, describing it as
    "a large faint nebula, very diffuse".  Multiple star ''B 1'' or β 1 was later
    discovered by S. W. Burnham, whose bright component is identified as the highly
    luminous O6 spectral class star, HD 5005 or HIP 4121. It consists of an 8th-magnitude
    primary with four companions at distances between 1.4 and 15.7 arcsec.  There
    has been no appreciable change in this quintuple system since the first measures
    were made in 1875.

    The nebula region is visible in amateur telescopes from dark sky locations.

    In his book Deep Sky Wonders, Walter Scott Houston describes the appearance of
    the nebula in small telescopes:


    "There was a faint glow in the immediate vicinity of the multiple star, with an
    occasional impression of a much larger nebulosity...Its surface brightness was
    much less than that of M33 in Triangulum or NGC 205, the distant companion of
    the Andromeda galaxy."'
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/NGC%20281
- Object: NGC2899

    is relatively nearby, and consequently, the Hubble Space Telescope can easily
    resolve the stars within the galaxy. The distance to the galaxy was previously
    believed to be only 2.4 Mpc (7.8 Mly).  However, in 2008 scientists studying images
    from Hubble calculated the galaxy's distance at nearly 11 million light-years
    away, about 4 million light-years farther than previously thought, meaning it

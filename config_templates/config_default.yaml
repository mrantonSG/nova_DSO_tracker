  description_text: Messier 61 (also known as M61, NGC 4303, or the Swelling Spiral
    Galaxy) is an intermediate barred spiral galaxy in the Virgo Cluster of galaxies.
    It was first discovered by Barnaba Oriani on May 5, 1779, six days before Charles
    Messier discovered the same galaxy. Messier had observed it on the same night
    as Oriani but had mistaken it for a comet. Its distance  has been estimated to
    be  45.61 million light years from  the Milky Way Galaxy. It is a member of the
    M61 Group of galaxies, which is a member of the Virgo II Groups, a series of galaxies
    and galaxy clusters strung out from the southern edge of the Virgo Supercluster.

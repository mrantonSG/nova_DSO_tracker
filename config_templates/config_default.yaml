  description_text: 'NGC 7814 (also known as UGC 8 or Caldwell 43) is a spiral galaxy
    about 40 million light-years away in the constellation Pegasus.  The galaxy is
    seen edge-on from Earth.  It is sometimes referred to as "the little sombrero",
    a miniature version of Messier 104.  The star field behind NGC 7814 is known for
    its density of faint, remote galaxies as can be seen in the image here, in the
    same vein as the Hubble Deep Field.

    It''s among the few bright galaxies that exhibit modest distortion and twisting
    of the galaxy''s plane in optical wavelengths.

    The light from the distant background galaxies becomes more red as it passes through
    NGC 7814''s halo. This has been used to determine the amount of gas and dust in
    the halo.

    One supernova has been observed in NGC 7814: SN 2021rhu (Type Ia, mag 15.66) was
    discovered by  Automatic Learning for the Rapid Classification of Events (ALeRCE)
    on 1 July 2021.'
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/NGC%207814

  image_credit: Adam Block/Mount Lemmon SkyCenter/University of Arizona (CC BY-SA
    3.0) via Wiki
  image_source_link: https://en.wikipedia.org/wiki/Sh%202-297
  description_text: 'Sh 2-297 (also known as Sharpless 297) is an emission nebula
    in the constellation Canis Major.

    The region was catalogued in 1959 in the extended seconded edition of the Sharpless
    catalogue. This area is part of the Canis Major OB1 Association, and is a very
    active area of new star formation.

    Studies in 1988 found that the bright star illuminating the nebula was 8th magnitude
    HD 53623 / HIP 34178 with spectral class B1II/III. Later in 2004 it was shown
    that there was embedded a cold but massive Young Stellar Object or YSO within
    Sh 2-297 near the edge of one of the dark rifts. This object has been observed
    in the far-infrared, but it is so deeply embedded in an interstellar cloud that
    it is undetectable in shorter wavelength observations such as the Two Micron All
    Sky Survey (2MASS), leading it to be originally named "Unidentified young stellar
    object 1" or UYSO-1. It was further revealed that this unseen stellar source produces
    a carbon monoxide (CO) bipolar outflow with a total mass of  5.4 M☉ solar masses,
    while the surrounding extended envelope weighs 30 M☉–40 M☉. Some 96 other YSOs
    have been discovered to be part of Sh-297, having a mean age of one million years
    and range in masses between 0.3 M☉ and 2.0 M☉. Many variable stars are also assigned
    with this nebula complex, including the three brightest: MW Ori, TT Ori and V559
    Ori.


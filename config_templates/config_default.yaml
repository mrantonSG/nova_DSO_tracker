    on 7 September 1885 by the American astronomer Edward Swift, and is approximately
    120,000 light-years across. NGC 2523 does not have much star formation, and it
    does not have an active galactic nucleus.

    NGC 2523 is one of several galaxies chosen by Halton Arp as an example of a spiral
    galaxy that has a separation of one of its arms. It is listed in Arp''s Atlas

  image_credit: Jschulman555 (CC BY-SA 3.0) via Wiki
  image_source_link: https://en.wikipedia.org/wiki/NGC%204490
  description_text: 'NGC 4490, also known as the Cocoon Galaxy, is a barred spiral
    galaxy in the constellation Canes Venatici. It was discovered by German-British
    astronomer William Herschel on 14 January 1788. It is known to be one of the closest
    interacting/merging galactic systems. The galaxy lies at a distance of 25 million
    light years from Earth. It interacts with its smaller companion NGC 4485 and as
    a result is a starburst galaxy. NGC 4490 and NGC 4485 are collectively known in
    the Atlas of Peculiar Galaxies as Arp 269.  The two galaxies have already made
    their closest approach and are rushing away from each other. It has been discovered
    that NGC 4490 has a double nucleus.

    NGC 4490 is located 45 arcminutes northwest of beta Canum Venaticorum and with
    apparent visual magnitude 9.8, can be observed with 15x100 binoculars. It is a
    member of the Herschel 400 Catalogue. It belongs to the Canes II Group. NGC 4490
    has a system of satellite galaxies oriented roughly in a plane.'
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/NGC%204490

- Object: LMC
  Common Name: Large Magellanic Cloud
  RA (hours): 5.392944444444444
  DEC (degrees): -69.75611111111111
  Type: G
  Constellation: Dor
  Magnitude: '0.4'
  Size: '322.83'
  SB: '12.68'

  image_credit: ESA/Hubble & NASA, F. Belfiore, J. Lee and the PHANGS-HST Team (CC
    BY 4.0) via Wiki
  image_source_link: https://en.wikipedia.org/wiki/NGC%202775
  description_text: "NGC 2775, also known as Caldwell 48, is a spiral galaxy in the\
    \ constellation Cancer. It is 67 million light-years (20.5 megaparsecs) away from\
    \ the Milky Way. It was discovered by German-British astronomer William Herschel\
    \ on 19 December 1783. \nThis object has a morphological classification of SA(r)ab,\
    \ which indicates an unbarred spiral galaxy (SA) with a prominent ring structure\
    \ (r) and flocculent, tightly wound spiral arms (ab). The galaxy is inclined by\
    \ an angle of 44° to the line of sight from the Earth. The galactic nucleus is\
    \ not active and the large nuclear bulge, which extends out to an angular radius\
    \ of 0.4′, is relatively gas free. An explanation for the latter could be a high\
    \ supernova rate. Although star formation is taking place in the dusty outer ring,\
    \ NGC 2775 does not display any current starburst activity, and the galactic nucleus\
    \ is virtually free of any star formation whatsoever.\nThe galaxy's hydrogen tail\
    \ feature indicates a past interaction with a faint companion. A satellite galaxy\
    \ appears to have orbited NGC 2775 multiple times, losing mass as it did so and\
    \ creating faint, shell-like structures. Nearby irregular galaxy NGC 2777 displays\
    \ a tidal tail of hydrogen gas that points back to NGC 2775, suggesting the two\
    \ may be linked."
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/NGC%202775

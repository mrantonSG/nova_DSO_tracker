  description_text: NGC 300 (also known as Caldwell 70 or the Sculptor Pinwheel Galaxy)
    is a spiral galaxy in the constellation Sculptor. It was discovered on 5 August
    1826 by Scottish astronomer James Dunlop. It is one of the closest galaxies to
    the Local Group, and it most likely lies between the latter and the Sculptor Group.  It
    is the brightest of the five main spirals in the direction of the Sculptor Group.
    It is inclined at an angle of 42° when viewed from Earth and shares many characteristics
    of the Triangulum Galaxy. It is about 94,000 light-years in diameter, somewhat
    smaller than the Milky Way, and has an estimated mass of (2.9 ± 0.2) × 1010 M☉.
  description_credit: Wikipedia

  description_text: NGC 7479 (also known as Caldwell 44 or the Superman Galaxy) is
    a barred spiral galaxy about 105 million light-years away in the constellation
    Pegasus.  William Herschel discovered it in 1784.  NGC 7479 is also recognized
    as a Seyfert galaxy and a LINER undergoing starburst activity not only on the
    nucleus and the outer arms, but also across the bar of the galaxy, where most
    of the stars were formed in the last 100 million years. Polarization studies of
    this galaxy indicate that it recently underwent a minor merger and that it is
    unique in the radio continuum, with arms opening in a direction opposite to the
    optical arms. This feature, along with the asymmetrical arms of the galaxy and
    the intense star formation activity are attributed to a merger with a smaller
    galaxy. This galaxy is similar in both size and morphology to the barred spiral
    NGC 1300.
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/NGC%207479

  description_text: "NGC 559 (also known as Caldwell 8) is an open cluster and Caldwell\
    \ object in the constellation Cassiopeia. It shines at magnitude +9.5. Its celestial\
    \ coordinates are RA 01h 29.5m , dec +63° 18′. It is located near the open cluster\
    \ NGC 637, and the bright magnitude +2.2 irregular variable star Gamma Cassiopeiae.\
    \ The cluster is 7 arcmins across.\nIt was discovered by William Herschel in 1787.\
    \ \nThe object is also called Ghost's Goblet. This name was coined by astronomer\
    \ Stephen J. O'Meara, as the center of the star cluster, with a little imagination,\
    \ is reminiscent of a still photograph of a jeweled goblet that is about to vanish\
    \ in a ghostly manner. O'Meara attributes the impression of fading to the low\
    \ brightness (about +12) of many stars in the center as well as to the great age\
    \ of the star cluster, which is about 1.8 billion years old."
  description_credit: Wikipedia

  image_source_link: https://en.wikipedia.org/wiki/Arp%20273
  description_text: 'Arp 273 is a pair of interacting galaxies, 300 million light
    years away in the constellation Andromeda. It was first described in the Atlas
    of Peculiar Galaxies, compiled by Halton Arp in 1966. The larger of the spiral
    galaxies, known as UGC 1810, is about five times more massive than the smaller
    galaxy. It has a disc that is tidally distorted into a rose-like shape by the
    gravitational pull of the companion galaxy below it, known as UGC 1813. The smaller
    galaxy shows distinct signs of active star formation at its nucleus, and "it is
    thought that the smaller galaxy has actually passed through the larger one."

    One supernova has been observed in UGC 1810: SN 1962R (type unknown, mag. 15.9)
    was discovered on plates taken at the Lick Observatory in December 1962, and presumed
    to be of type II.'
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/Arp%20273

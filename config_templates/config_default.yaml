  image_credit: ESO/J. Emerson/VISTA (CC BY 4.0) via Wiki
  image_source_link: https://en.wikipedia.org/wiki/Messier%2055
  description_text: 'Messier 55 (also known as M55, NGC 6809, or Specter Cluster)
    is a globular cluster in the south of the constellation Sagittarius. It was discovered
    by Nicolas Louis de Lacaille in 1752 while observing from what today is South
    Africa.  Starting in 1754, Charles Messier made several attempts to find this
    object from Paris but its low declination meant from there it rises daily very
    little above the horizon, hampering observation.  He observed and catalogued it
    in 1778.  The cluster can be seen with 50 mm binoculars; resolving individual
    stars needs a medium-sized telescope.

    It is about 17,600 light-years away from Earth. It contains about 269,000 solar
    masses (M☉). As with other Milky Way globular clusters, it has few elements other
    than hydrogen and helium compared to the Sun. Messier 55 therefore has "low metallicity".
    This quantity is normally listed as the base 10 logarithm of the proportion of
    the Sun; for NGC 6809 the metallicity is given by: [Fe/H] = −1.94 dex, whereby
    −2 would be 100 times less iron than the Sun. This means the cluster has 1.1%
    of the proportion of the Sun''s iron compared to hydrogen and helium.

    Only about 55 variable stars have been found in the central part of M55.'
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/Messier%2055
- Object: M56
  Common Name: M56
  RA (hours): 19.276547222222224
  DEC (degrees): 30.183472222222214
  Type: GlC
  Constellation: Lyr
  Magnitude: '8.300000190734863'
  Size: '7.099999904632568'
  SB: '12.29'
  catalog_info: null
  image_url: https://upload.wikimedia.org/wikipedia/commons/thumb/7/73/Messier_56_Hubble_WikiSky.jpg/960px-Messier_56_Hubble_WikiSky.jpg
  image_credit: en:NASA, en:STScI, en:WikiSky (Public domain) via Wiki
  image_source_link: https://en.wikipedia.org/wiki/Messier%2056
  description_text: 'Messier 56 (also known as M56 or NGC 6779) is a globular cluster
    in the constellation Lyra. It was discovered by Charles Messier in 1779. It is
    angularly found about midway between Albireo (Beta (β) Cygni) and Sulafat (Gamma
    (γ) Lyrae). In a good night sky it is tricky to find with large (50–80 mm) binoculars,
    appearing as a slightly fuzzy star. The cluster can be resolved using a telescope
    with an aperture of 8 in (20 cm) or larger.

    M56 is about 32,900 light-years away from Earth and measures roughly 84 light-years
    across, containing 230,000 solar masses (M☉). It is about 31–32 kly (9.5–9.8 kpc)
    from the Galactic Center and 4.8 kly (1.5 kpc) above the galactic plane. This
    cluster has an estimated age of 13.70 billion years and is following a retrograde
    orbit through the Milky Way. The properties of this cluster suggest that it may
    have been acquired during the merger of a dwarf galaxy, of which Omega Centauri
    forms the surviving nucleus. For Messier 56, the abundance of elements other than
    hydrogen and helium, what astronomers term the metallicity, has a very low value
    of [Fe/H] = –2.00 dex which is 1⁄100 of the abundance in the Sun.

    The brightest stars in M56 are of 13th magnitude, while it contains only about
    a dozen known variable stars, such as V6 (RV Tauri star; period: 90 days) or V1
    (Cepheid: 1.510 days); other variable stars are V2 (irregular) and V3 (semiregular).
    In 2000, a diffuse X-ray emission was tentatively identified coming from the vicinity
    of the cluster. This is most likely interstellar medium that has been heated by
    the passage of the cluster through the galactic halo. The relative velocity of
    the cluster is about 177 km s−1, which is sufficient to heat the medium in its
    wake to a temperature of 940,000 K.

    M56 is part of the Gaia Sausage, the hypothesised remains of a merged dwarf galaxy.


    '
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/Messier%2056

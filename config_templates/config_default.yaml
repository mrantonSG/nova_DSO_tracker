  description_text: NGC 6822 (also known as Barnard's Galaxy, IC 4895, or Caldwell
    57) is a barred irregular galaxy approximately 1.6 million light-years away in
    the constellation Sagittarius.  Part of the Local Group of galaxies, it was discovered
    by E. E. Barnard in 1884, with a six-inch refractor telescope.  It is the closest
    non-satellite galaxy to the Milky Way, but lies just outside its virial radius.  It
    is similar in structure and composition to the Small Magellanic Cloud. It is about
    7,000 light-years in diameter.

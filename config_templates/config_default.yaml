  image_credit: Hewholooks (CC BY-SA 3.0) via Wiki
  image_source_link: https://en.wikipedia.org/wiki/Sh%202-155
  description_text: 'Sh 2-155 (also designated Caldwell 9, Sharpless 155 or S155,
    or LBN529) is a diffuse nebula in the constellation Cepheus, within a larger nebula
    complex containing emission, reflection, and dark nebulosity. It is widely known
    as the Cave Nebula, though that name was applied earlier to Ced 201, a different
    nebula in Cepheus.  Sh 2-155 is an ionized H II region with ongoing star formation
    activity, at an estimated distance of 725 parsecs (2400 light-years) from Earth.

    Sh 2-155 was first noted as a galactic emission nebula in 1959 in the extended
    second edition of the Sharpless catalogue, being a part of the much larger Cep
    OB3 Association. Although Sh 2-155 is relatively faint for amateur observation,
    some of its structure may be seen visually through a moderately sized telescope
    under dark skies.

    Sh 2-155 lies at the edge of the Cepheus B cloud (part of the Cepheus molecular
    cloud), and is ionized by young stars from the Cep OB3 association. It has been
    suggested that radiation from the hot O-type star HD 217086 is compressing the
    region, triggering the formation of a new generation of stars. A study of the
    region''s young stellar objects by the Chandra X-ray Observatory and Spitzer Space
    Telescope shows a progression of stellar ages in front of the cloud, supporting
    the hypothesis of triggered star-formation.'
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/Sh%202-155
- Object: C90
  Common Name: NGC 2867
  RA (hours): 9.357051
  DEC (degrees): -58.311285
  Type: PN
  Constellation: Car
  Magnitude: '10.300000190734863'

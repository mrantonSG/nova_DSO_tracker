  image_url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/55/N3338s.jpg/960px-N3338s.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail
  image_credit: Credit Line and Copyright        Adam Block/Mount Lemmon SkyCenter/University
    of Arizona (CC BY-SA 3.0 us) via Wiki
  image_source_link: https://en.wikipedia.org/wiki/NGC%203338
  description_text: 'NGC 3338 is a spiral galaxy in the constellation Leo. The galaxy
    lies about 75 million light years away from Earth, which means, given its apparent
    dimensions, that NGC 3338 is approximately 130,000 light years across. It was
    discovered by William Herschel on March 19, 1784.

    NGC 3338 is categorised as a SA(s)c galaxy, meaning it is a spiral galaxy with
    no bar. It has a small elliptical bulge. The stellar velocity dispertion in the
    pseudobulge of NGC 3338 is 78 ± 2 km/s. The galaxy has two thin and well ordered
    spiral arms, but its overall pattern is between a grand design galaxy and multiple
    spiral arms as there are many spiral fragments between the arms. At their beginning
    the arms have different pitch angles but are symmetric and diffuse in their outer
    parts. The arms are bright for about half a revolution and their fainter extremities
    can be traced for another half revolution. There are some knots in the disk and
    HII regions, the largest of which more than two arcseconds across.

    NGC 3338 is the foremost galaxy of the NGC 3338 Group. Other members of the group
    include NGC 3346, NGC 3389, UGC 5832 and Mrk 1263. At least 8 satellite galaxies
    have been found around NGC 3338 and five more are possible satellites. The group
    is part of the Leo II Groups, a large cloud of galaxies in the Virgo Supercluster.'
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/NGC%203338
- Object: NGC3372

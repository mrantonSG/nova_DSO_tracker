  image_credit: ESO (CC BY 4.0) via Wiki
  image_source_link: https://en.wikipedia.org/wiki/Barnard%2068
  description_text: 'Barnard 68 is a molecular cloud, dark absorption nebula or Bok
    globule, towards the southern constellation Ophiuchus and well within the Milky
    Way galaxy at a distance of about 125 parsecs (407 light-years). It is both close
    and dense enough that stars behind it cannot be seen from Earth. American astronomer
    Edward Emerson Barnard added this nebula to his catalog of dark nebulae in 1919.
    His catalog was published in 1927, at which stage it included some 350 objects.
    Because of its opacity, its interior is extremely cold, its temperature being
    about 16 K (−257 °C/−431 °F). Its mass is about twice that of the Sun, and it
    measures about half a light-year across.


    '
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/Barnard%2068

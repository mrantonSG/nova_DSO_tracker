  description_text: 'NGC 6842 is a planetary nebula in Cygnus, along the border with
    Vulpecula. It was independently discovered three times. First on 28 June 1863
    by Albert Marth. Secondly, by Heinrich Louis d''Arrest on 26 August, 1864. Finally,
    on 26 August 1864 by Truman Henry Safford. It was later identified as a planetary
    nebula by Heber Doust Curtis in 1919.

    The central star is magnitude 16.2'

  description_text: 'Maffei 1 is a massive elliptical galaxy near the constellation
    borders between Perseus and Cassiopeia, located 9.8 million light years away.
    Once believed to be a member of the Local Group of galaxies, it is now known to
    belong to a separate group, the IC 342/Maffei Group.  It was named after Paolo
    Maffei, who discovered it and the neighboring Maffei 2 in 1967 via their infrared
    emissions.

    Maffei 1 is a slightly flattened core type elliptical galaxy. It has a boxy shape
    and is made mainly of old metal-rich stars. It has a tiny blue nucleus in which
    stars continue to form. Like all large ellipticals it contains a significant population
    of globular clusters. Maffei 1 is situated at an estimated distance of 3–4 Mpc
    from the Milky Way. It may be the closest giant elliptical galaxy.

    Maffei 1 lies in the Zone of Avoidance and is heavily obscured by the Milky Way''s
    stars and dust. If it were not obscured, it would be one of the largest (about
    3⁄4 the size of the full moon), brightest, and best-known galaxies in the sky.
    It can be observed visually, using a 30–35 cm or bigger telescope under a very
    dark sky.'

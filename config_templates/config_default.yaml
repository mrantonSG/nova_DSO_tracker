  image_credit: Own work (CC BY-SA 3.0) via Wiki
  image_source_link: https://en.wikipedia.org/wiki/NGC%204697
  description_text: 'NGC 4697 (also known as Caldwell 52) is an elliptical galaxy
    some 40 to 50 million light-years away in the constellation Virgo. It is a member
    of the NGC 4697 Group, a group of galaxies also containing NGC 4731 and several
    generally much smaller galaxies. This group is about 55 million light-years away;
    it is one of the many Virgo II Groups, which form a southern extension of the
    Virgo Supercluster of galaxies.

    The distance to NGC 4697 is not known with high precision: measurements vary from
    28 to 76 million light-years. According to the NASA Extra-galactic Database, the
    average is about 38 million light-years; according to SIMBAD, about 50 million
    light-years.

    The supermassive black hole at the core of NGC 4697 has a mass of 1.3+0.18−0.17×108
    M☉ as measured from Atacama Large Millimeter Array observations of the rotation
    of the central gas disk.

    One supernova has been observed in NGC 4697: SN 2018imd (type Ia, mag. 15.5).

    On 2 April 1950, it was occulted by the Moon during a Total Lunar Eclipse over
    the Iberian Peninsula, Africa, Madagascar, Arabia and the Indian Ocean. This happened
    again under the same conditions on the April 1996 lunar eclipse over the same
    locations, and again during the April 2015 lunar eclipse over extreme NE Siberia
    and North America. It will next happen on 4 April 2080 over the Pacific Ocean
    including Hawaii.'
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/NGC%204697

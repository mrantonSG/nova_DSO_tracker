  image_credit: 'Credit:KPNO/NOIRLab/NSF/AURAData obtained and processed by: P. Massey
    (Lowell Obs.), G. Jacoby, K. Olsen, & C. Smith (NOAO/AURA/NSF)Image processing:
    Travis Rector (University of Alaska Anchorage), Mahdi Zamani & Davide de Martin
    (CC BY 4.0) via Wiki'
  image_source_link: https://en.wikipedia.org/wiki/IC%2010
  description_text: "IC 10 is an irregular galaxy in the constellation Cassiopeia.\
    \ It was discovered by American astronomer Lewis Swift on 8 October 1887. In 1935\
    \ Nicholas Mayall became the first to suggest that the object is extragalactic.\
    \ Edwin Hubble suspected it might belong to the Local Group of galaxies, but its\
    \ status remained uncertain for decades. The radial velocity of IC 10 was measured\
    \ in 1962, and it was found to be approaching the Milky Way at approximately 350\
    \ km/s, strengthening the evidence for its membership in the Local Group. Its\
    \ membership in the group was finally confirmed in 1996 by direct measurements\
    \ of its\ndistance based on observations of Cepheids; most estimates place the\
    \ galaxy 2–3 million light years from Earth, with some estimates ranging from\
    \ 1.5–4.5 million light years. Despite its closeness, the galaxy is rather difficult\
    \ to study because it lies near the plane of the Milky Way and is therefore \n\
    heavily obscured by interstellar matter.\nThe apparent distance between IC 10\
    \ and the Andromeda Galaxy is about the same as the apparent distance between\
    \ the Andromeda Galaxy and the Triangulum Galaxy, which suggests that IC 10 may\
    \ belong to the M31 subgroup.\nIC 10 is the only known starburst galaxy in the\
    \ Local Group of galaxies; it has many more Wolf–Rayet stars per square kiloparsec\
    \ (5.1 stars/kpc2) than the Large Magellanic Cloud (2.0 stars/kpc2) or the Small\
    \ Magellanic Cloud (0.9 stars/kpc2). Although the galaxy has a luminosity similar\
    \ to the SMC, it is considerably smaller, with an estimated diameter of around\
    \ 5000 light years. Its higher metallicity compared to the SMC suggests that star\
    \ formation activity has continued for a longer time period. The H II regions\
    \ in IC 10 have all formed recently, within the last 10 Myr. The evolutionary\
    \ status of the Wolf–Rayet stars suggests that they all formed in a relatively\
    \ short timespan. The ratio between the two types of Wolf–Rayet stars (WC stars\
    \ and WN stars) in IC 10 is very different from the ratio in other galaxies in\
    \ the Local Group, which may be somehow due to the starburst nature of the galaxy.\
    \ Currently, the galaxy produces stars at the rate of 0.04–0.08 solar masses per\
    \ year, which means that the gas supply in the galaxy can last for only a few\
    \ billion years longer.\nObservations of IC 10 in the far-infrared show that the\
    \ dust in this mild starburst galaxy is deficient in small grains. It is hypothesized\
    \ that any small grains that formerly existed were destroyed by strong ultraviolet\
    \ radiation in the areas around the hot luminous stars that were formed in the\
    \ galaxy's recent burst of star formation.\nThe galaxy has a huge envelope of\
    \ hydrogen gas, with an apparent size measuring 68′ × 80′, which is far larger\
    \ than the apparent size of the galaxy in visible light (5.5′ × 7.0′). IC 10 is\
    \ also unusual in the respect that the visible part of the galaxy seems to rotate\
    \ in a different direction than the outer envelope. It has an H II nucleus."
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/IC%2010

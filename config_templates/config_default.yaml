  description_text: 'Messier 54 (also known as M54 or NGC 6715) is a globular cluster
    in the constellation Sagittarius. It was discovered by Charles Messier in 1778
    and then included in his catalog of objects that could be mistaken for comets.

    It is easily found in the sky, being close to the star ζ Sagittarii. It is, however,
    not resolvable into individual stars even with larger amateur telescopes.

    In July 2009, a team of astronomers reported that they had found evidence of an
    intermediate-mass black hole in the core of M54.'
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/Messier%2054
- Object: M55
  Common Name: M55
  RA (hours): 19.666586111111112
  DEC (degrees): -30.96475

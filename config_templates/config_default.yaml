  image_source_link: https://en.wikipedia.org/wiki/Messier%2050
  description_text: 'Messier 50 or M 50, also known as NGC 2323 or the Heart-shaped
    Cluster, is an open cluster of stars in the constellation Monoceros. It was recorded
    by G. D. Cassini before 1711 and independently discovered by Charles Messier in
    1772 while observing Biela''s Comet. It is sometimes described as a ''heart-shaped''
    figure or a blunt arrowhead.

    M50 is about 2,900 light-years away from Earth and is near to but narrowly not
    estimated to be gravitationally tied to the Canis Major (CMa) OB1 association.
    It has a core radius of 5.9 ly (1.8 pc) and spans 17.8 ly (5.46 pc). The cluster
    has 508 confirmed and 109 probable members – their combined mass is more than
    285 M☉, the mean stellar density would thus be 1.3 stars per cubic parsec. It
    is around 140 million years old, with two high-mass white dwarfs and two chemically
    peculiar stars.

    Traditionally considered to be a single star cluster, in 2025 it was found to
    consist of two separate sub-clusters (NGC 2323-a and NGC 2323-b), making it a
    binary cluster.


    '
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/Messier%2050
- Object: M51
  Common Name: Whirlpool Galaxy
  RA (hours): 13.497971666666666

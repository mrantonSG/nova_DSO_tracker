  RA (hours): 5.65
  DEC (degrees): 27.833333333333332
  Type: SNR
  Constellation: Tau
  Magnitude: '14.55'
  Size: '180.0'
  SB: '25.56'
  catalog_info: null
  image_url: https://upload.wikimedia.org/wikipedia/commons/thumb/1/1f/S147_SH2-240_GeorgesAttard_Apod1012020.jpg/960px-S147_SH2-240_GeorgesAttard_Apod1012020.jpg
  image_credit: Georges Attard (CC BY-SA 4.0) via Wiki
  image_source_link: https://en.wikipedia.org/wiki/Simeis%20147
  description_text: "Simeis 147, also known as the Spaghetti Nebula, SNR G180.0-01.7\
    \ or Sharpless 2-240, is a supernova remnant (SNR) in the Milky Way, straddling\
    \ the border between the constellations Auriga and Taurus. It was discovered in\
    \ 1952 at the Crimean Astrophysical Observatory by Grigory Shajn and his team\
    \ using a Schmidt camera and a narrowband filter close to the Hydrogen Alpha transmission\
    \ line. It is difficult to observe due to its extremely low surface brightness.\
    \ This discovery was part of a survey conducted between 1945 and 1955, most likely\
    \ using captured German equipment, as the observatory was practically destroyed\
    \ during WWII. The Schmidt camera had a field of view of 175'. Many previously\
    \ unknown hydrogen nebula were discovered this way, as they are not readily visible\
    \ in regular photographs. \nThe nebulous area has an almost spherical shell and\
    \ a filamentary structure. The remnant has an apparent diameter of approximately\
    \ 3 degrees, an estimated distance of approximately 3000 (±350) light-years, and\
    \ an age of approximately 40,000 years. At that distance, it spans roughly 160\
    \ lightyears.\nIt is believed that the stellar explosion left behind a rapidly\
    \ spinning neutron star known as pulsar PSR J0538+2817 in the nebula core, emitting\
    \ a strong radio signal."
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/Simeis%20147
- Object: VDB1
  Common Name: vdB 1
  RA (hours): 0.179546083122
  DEC (degrees): 58.76951836064
  Type: '**'
  Constellation: Cas
  Magnitude: '8.25'
  Size: '0.0017000000225380063'
  SB: '-5.86'
  catalog_info: null
  image_url: https://upload.wikimedia.org/wikipedia/commons/b/b5/VdB1_Nebula_from_the_Mount_Lemmon_SkyCenter_Schulman_Telescope_courtesy_Adam_Block_%28cropped%29.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled
  image_credit: Adam Block/Mount Lemmon SkyCenter/University of Arizona (CC BY-SA
    4.0) via Wiki
  image_source_link: https://en.wikipedia.org/wiki/VdB%201
  description_text: 'VdB 1 is a small reflection nebula located in the constellation
    of Cassiopeia. It lies a few arcminutes to the south-east of the bright yellow-hued
    giant star Beta Cassiopeiae, officially named Caph. VdB 1 lies about 1,600 light-years
    away.  Close to VdB 1 is the dark nebula LDN 1265. It is barely visible due to
    the brightness of Beta Cassiopeiae.

    Its importance is linked to the presence of a pre-main sequence star known as
    V633 Cassiopeiae (LkHα  198), first identified in 1960. Its spectrum has been
    estimated as B3, B9 or A5 depending on the interpretation, its distance is 600
    parsecs (almost 2000 light years) and its real luminosity is 160 L☉, it also shows
    strong cataclysmic activity with flares. During the nineties a companion was discovered
    nested deep in the cloud, which seems to be the main responsible for most of the
    near-infrared emissions observed in the region, the real separation from the primary
    would be about 3300 AU and its luminosity would be about 100 L☉.

    Within the cloud, several jets are known, coinciding with as many HH objects:
    this is the case of HH  161, south-east of V633 Cas and linked to its hidden companion
    HH 162, associated with the nearby V376 Cas, and HH  164, whose source is the
    same V633 Cas. Three further jets are said to be connected to V633  Cas and its
    companion, catalogued as HH 800, HH 801 and HH 802, with a powerful jet visible
    even in optical light with a length of 2 parsecs (about 7 light years).'
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/VdB%201

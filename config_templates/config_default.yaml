  description_text: 'NGC 752 (also known as Caldwell 28) is an open cluster in the
    constellation Andromeda. The cluster was discovered by Caroline Herschel in 1783
    and cataloged by her brother William Herschel in 1786, although an object that
    may have been NGC 752 was described by Giovanni Batista Hodierna before 1654.

    The large cluster lies 1,400 light-years away from the Earth and is easily seen
    through binoculars, although it may approach naked eye visibility under good observing
    conditions. A telescope reveals about 60 stars no brighter than 9th magnitude
    within NGC 752.'
  description_credit: Wikipedia

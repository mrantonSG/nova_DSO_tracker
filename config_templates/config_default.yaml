  description_text: 'NGC 1624, also known as Sh 2-212 in the Sharpless catalog, is
    a very young open cluster in the constellation Perseus inside an emission nebula.
    It was discovered by German-British astronomer William Herschel in 1790. Together
    with Sh 2-211, this nebula is part of the Tribble Nebulae.NGC 1624 is about 20,000
    ly (6,000 pc) from Earth, and latest estimates give it an age of less than 4 million
    years. Its apparent magnitude is 11.8, and apparent diameter is about 3.0 arc
    minutes. Its celestial location is right ascension (α) 04h 40m 36.0s and declination
    (δ) +50° 27′ 42″. It is potentially an area of massive star formation.

    According to Robert Trumpler''s classification of open clusters, this cluster
    contains fewer than 50 stars (letter p) with a high concentration (I) and whose
    magnitudes are distributed over an average interval (number 2). The letter n at
    the end (I2pn) means that the cluster is inside a nebula.'

  image_credit: 'International Gemini Observatory/NOIRLab/NSF/AURA/L. Bassino Image
    processing: J. Miller (Gemini Observatory/NSF’s NOIRLab), M. Rodriguez (Gemini
    Observatory/NSF’s NOIRLab), & M. Zamani (NSF’s NOIRLab) (CC BY 4.0) via Wiki'
  image_source_link: https://en.wikipedia.org/wiki/NGC%202685
  description_text: 'NGC 2685 (also known as the Helix Galaxy) is a lenticular and
    polar ring Seyfert Type 2 galaxy in the constellation Ursa Major. Its velocity
    with respect to the cosmic microwave background is 1003 ± 9 km/s, which corresponds
    to a Hubble distance of 48.2 ± 3.4 Mly (14.79 ± 1.05 Mpc). Additionally, eight
    non-redshift measurements give a distance of 42.56 ± 3.01 Mly (13.050 ± 0.924
    Mpc). It was discovered by German astronomer Wilhelm Tempel on 18 August 1882.

    NGC 2685 is an object of great scientific interest, because polar-ring galaxies
    are very rare galaxies. They are thought to form when two galaxies gravitationally
    interact with each other. "The bizarre configuration could be caused by the chance
    capture of material from another galaxy by a disk galaxy, with the captured debris
    strung out in a rotating ring. Still, observed properties of NGC 2685 suggest
    that the rotating ring structure is remarkably old and stable."

    Allan Sandage referred to NGC 2685 as "perhaps the most peculiar galaxy in the
    Shapley-Ames Catalog".'
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/NGC%202685

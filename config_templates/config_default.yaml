  description_text: Messier 77 (M77), also known as NGC 1068 or the Squid Galaxy,
    is a barred spiral galaxy in the constellation Cetus. It is about 47 million light-years
    (14 Mpc) away from Earth, and was discovered by Pierre Méchain in 1780, who originally
    described it as a nebula.  Méchain then communicated his discovery to Charles
    Messier, who subsequently listed the object in his catalog. Both Messier and William
    Herschel described this galaxy as a star cluster. Today, however, the object is
    known to be a galaxy. It is one of the brightest Seyfert galaxies visible from
    Earth and has a D25 isophotal diameter of about 27.70 kiloparsecs (90,000 light-years).
  description_credit: Wikipedia

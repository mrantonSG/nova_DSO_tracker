  image_source_link: https://en.wikipedia.org/wiki/NGC%206231
  description_text: 'NGC 6231 (also known as Caldwell 76 or the Baby Scorpion Cluster)
    is an open cluster in the southern sky located half a degrees north of Zeta Scorpii.
    NGC 6231 is part of a swath of young, bluish stars in the constellation Scorpius
    known as the Scorpius OB1 association. The star Zeta1 (HR 6262) is a member of
    this association, while its brighter apparent partner, Zeta2 (HR 6271), is only
    150 ly from Earth and so is not a member.

    This cluster is estimated to be about 2–7 million years old, and is approaching
    the Solar System at 22 km/s. The cluster and association lie in the neighboring
    Sagittarius Arm of the Milky Way.  Zeta1 Scorpii (spectral type O8 and magnitude
    4.71.) is the brightest star in the association, and one of the most radiant stars
    known in the galaxy. NGC 6231 was used to measure the binary fraction of B-type
    stars: 52%±8%, indicating that B-type stars are commonly found in binary systems,
    but not as commonly as in O-type stars.

    NGC 6231 also includes three Wolf-Rayet stars: HD 151932, HD 152270, and HD 152408.'
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/NGC%206231
- Object: C78

  image_source_link: https://en.wikipedia.org/wiki/Simeis%2022
  description_text: "Simeis 22, also known as the Firefox Nebula, is an planetary\
    \ nebula in Cassiopeia. It was discovered in the early 1950s by Grigory Shajn\
    \ and Vera Gaze. It was independently discovered by Stewart Sharpless. It was\
    \ first thought to be a supernova remnant, and was then thought to be a planetary\
    \ nebula. \nThe nebula is brightest towards the southwest, since that is the direction\
    \ the central star is moving. The nebula is a prominent example of interaction\
    \ with the interstellar medium, as the gasses being pushed by the central star\
    \ are also pushing against interstellar gasses, resulting in increased density\
    \ and mass, which creates a bow shock. At the edges of the bow shock, whirlpool\
    \ like structures have formed."
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/Simeis%2022

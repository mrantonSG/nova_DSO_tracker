  description_text: Messier 74 (also known as NGC 628 and Phantom Galaxy) is a large
    spiral galaxy in the equatorial constellation Pisces. It is about 32 million light-years
    away from Earth. The galaxy contains two clearly defined spiral arms and is therefore
    used as an archetypal example of a grand design spiral galaxy. The galaxy's low
    surface brightness makes it the most difficult Messier object for amateur astronomers
    to observe. Its relatively large angular (that is, apparent) size and the galaxy's
    face-on orientation make it an ideal object for professional astronomers who want
    to study spiral arm structure and spiral density waves. It is estimated that M74
    hosts about 100 billion stars.
  description_credit: Wikipedia

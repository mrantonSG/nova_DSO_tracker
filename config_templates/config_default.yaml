  image_source_link: https://en.wikipedia.org/wiki/NGC%20188
  description_text: 'NGC 188 (also known as Caldwell 1 or the Polarissima Cluster)
    is an open cluster in the constellation Cepheus. It was discovered by John Herschel
    in 1825.

    Unlike most open clusters that drift apart after a few million years because of
    the gravitational interaction of our Milky Way galaxy, NGC 188 lies far above
    the plane of the galaxy and is one of the most ancient of open clusters known,
    at approximately 6.8 billion years old.

    NGC 188 is very close to the North Celestial Pole, under five degrees away, and
    in the constellation of Cepheus at an estimated 6,000 light-years'' distance,
    this puts it slightly above the Milky Way''s disc and further from the center
    of the galaxy than the Sun.'
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/NGC%20188
- Object: C10
  Common Name: NGC 663
  RA (hours): 1.772833

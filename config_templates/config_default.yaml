  description_text: 'The Hyades (; Greek: Ὑάδες; also known as Caldwell 41, Collinder
    50, or Melotte 25) is the nearest open cluster and one of the best-studied star
    clusters. Located about 153 light-years (47 parsecs) away from the Sun, it consists
    of a roughly spherical group of hundreds of stars sharing the same age, place
    of origin, chemical characteristics, and motion through space. From the perspective
    of observers on Earth, the Hyades Cluster appears in the constellation Taurus,
    where its brightest stars form a "V" shape along with the still-brighter Aldebaran.
    However, Aldebaran is unrelated to the Hyades, as it is located much closer to
    Earth (65 light-years) and merely happens to lie along the same line of sight.

    The five brightest member stars of the Hyades have consumed the hydrogen fuel
    at their cores and have evolved into giant stars. Four of these stars, with Bayer
    designations Gamma, Delta1, Epsilon, and Theta2 Tauri, form an asterism that is
    traditionally identified as the head of Taurus the Bull. The fifth of these stars
    is Theta1 Tauri, a tight naked-eye companion to the brighter Theta2 Tauri. Epsilon
    Tauri, known as Ain (the "Bull''s Eye"), has a gas giant exoplanet candidate,
    the first planet to be found in any open cluster.

    The age of the Hyades is estimated to be about 625 million years. The core of
    the cluster, where stars are the most densely packed, has a radius of 8.8 light-years
    (2.7 parsecs), and the cluster''s tidal radius – where the stars become more strongly
    influenced by the gravity of the surrounding Milky Way galaxy – is 33 light-years
    (10 parsecs). However, about one-third of confirmed member stars have been observed
    well outside the latter boundary, in the cluster''s extended halo; these stars
    are probably in the process of escaping from its gravitational influence.


    '
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/Hyades%20(star%20cluster)

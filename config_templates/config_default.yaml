  description_text: 'NGC 5005, also known as Caldwell 29, is an inclined spiral galaxy
    in the constellation Canes Venatici. It was discovered by German-British astronomer
    William Herschel on 1 May 1785. The galaxy has a relatively bright nucleus and
    a bright disk that contains multiple dust lanes.  The galaxy''s high surface brightness
    makes it an object that is visible to amateur astronomers using large amateur
    telescopes.

    Distance measurements for NGC 5005 vary from 13.7 megaparsecs (45 million light-years)
    to 34.6 megaparsecs (113 million light-years), averaging about 20 megaparsecs
    (65 million light-years).'

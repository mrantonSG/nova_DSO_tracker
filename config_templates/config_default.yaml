  image_source_link: https://en.wikipedia.org/wiki/Messier%2070
  description_text: "Messier 70 or M70, also known as NGC 6681, is a globular cluster\
    \ of stars to be found in the south of Sagittarius. It was discovered by Charles\
    \ Messier in 1780. The famous comet Hale–Bopp was discovered near this cluster\
    \ in 1995. \nIt is about 29,400 light years away from Earth and around 6,500 light-years\
    \ from the Galactic Center. It is roughly the same size and luminosity as its\
    \ neighbour in space, M69. M70 has a very small core radius of 0.22 ly (0.068\
    \ pc) and a half-light radius of 182.0 ly (55.80 pc). This cluster has undergone\
    \ core collapse, leaving it centrally concentrated with the luminosity distribution\
    \ following a power law.\nThere are two distinct stellar populations in the cluster,\
    \ with each displaying unique abundances. These likely represent different generations\
    \ of stars. Five known variable stars lie within its broadest radius, the tidal\
    \ radius, all of which are RR Lyrae variables. The cluster may have two blue stragglers\
    \ near the core."
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/Messier%2070

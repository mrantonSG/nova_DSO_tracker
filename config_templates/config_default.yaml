  description_text: NGC 4631 (also known as the Whale Galaxy or Caldwell 32) is a  barred
    spiral galaxy in the constellation Canes Venatici about 30 million light years
    away from Earth. It was discovered on 20 March 1787 by German-British astronomer
    William Herschel. This galaxy's slightly distorted wedge shape gives it the appearance
    of a herring or a whale, hence its nickname.  Because this nearby galaxy is seen
    edge-on from Earth, professional astronomers observe this galaxy to better understand
    the gas and stars located outside the plane of the galaxy.

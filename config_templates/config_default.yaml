  image_source_link: https://en.wikipedia.org/wiki/Messier%2084
  description_text: 'Messier 84 or M84, also known as NGC 4374, is a giant elliptical
    or lenticular galaxy in the constellation Virgo. Charles Messier discovered the
    object in 1781 in a systematic search for "nebulous objects" in the night sky.
    It is the 84th object in the Messier Catalogue and in the heavily populated core
    of the Virgo Cluster of galaxies, part of the local supercluster.

    This galaxy has morphological classification E1, denoting it has flattening of
    about 10%. The extinction-corrected total luminosity in the visual band is about
    7.64×1010 L☉. The central mass-to-light ratio is 6.5, which, to a limit, steadily
    increases away from the core. The visible galaxy is surrounded by a massive dark
    matter halo.

    Radio observations and Hubble Space Telescope images of M84 have revealed two
    jets of matter shooting out from its center as well as a disk of rapidly rotating
    gas and stars indicating the presence of a 1.5 ×109 M☉ supermassive black hole.
    It also has a few young stars and star clusters, indicating star formation at
    a very low rate. The number of globular clusters is 1,775±150, which is much lower
    than expected for an elliptical galaxy.

    Viewed from Earth its half-light radius, relative angular size of its 50% peak
    of lit zone of the sky, is 72.5″, thus just over an arcminute.


    '
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/Messier%2084

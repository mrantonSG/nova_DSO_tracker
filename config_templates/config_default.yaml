  image_source_link: https://en.wikipedia.org/wiki/Messier%2080
  description_text: 'Messier 80 (also known as M80 or NGC 6093) is a globular cluster
    located approximately 32,600 light-years (10,000 pc) from Earth in the constellation
    Scorpius. Discovered by Charles Messier in 1781, it is one of the densest globular
    clusters in the Milky Way, containing several hundred thousand stars within a
    spatial diameter of about 95 light-years.

    The cluster is situated in the Galactic halo, more than twice as distant as the
    Galactic Center, and lies midway between the stars α Scorpii (Antares) and β Scorpii
    in a region rich with nebulæ. With an apparent angular diameter of 10 arcminutes,
    it can be observed from locations below the 67th parallel north using modest amateur
    telescopes, where it appears as a mottled ball of light under low light pollution
    conditions.

    Messier 80 is notable for its high population of blue stragglers, stars that appear
    younger than the cluster itself. Hubble Space Telescope observations reveal these
    stars are concentrated in distinct regions, suggesting frequent stellar interactions
    or collisions in the cluster''s dense core. On May 21, 1860, the cluster hosted
    the nova T Scorpii, which briefly outshone the entire cluster with an absolute
    magnitude of −8.5 and reached an apparent magnitude of +7.0, visible through telescopes
    and binoculars.


    '
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/Messier%2080

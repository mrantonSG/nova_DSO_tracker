  description_text: '47 Tucanae, also designated as NGC 104, Caldwell 106 or simply
    47 Tuc, is a globular cluster located in the constellation Tucana. It is about
    4.45 ± 0.01 kpc (14,500 ± 32.6 ly) from Earth, and 120 light years in diameter.
    47 Tuc can be seen with the naked eye, with an apparent magnitude of 4.1. It appears
    about 44 arcminutes across including its far outreaches. Due to its far southern
    location, 18° from the south celestial pole, it was not catalogued by European
    astronomers until the 1750s, when the cluster was first identified by Nicolas-Louis
    de Lacaille from South Africa.

    47 Tucanae is the second brightest globular cluster after Omega Centauri, and
    telescopically reveals about ten thousand stars, many appearing within a small
    dense central core. The cluster may contain an intermediate-mass black hole.


    '
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/47%20Tucanae

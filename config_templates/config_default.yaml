  image_url: https://upload.wikimedia.org/wikipedia/commons/thumb/1/12/NGC663HunterWilson.jpg/960px-NGC663HunterWilson.jpg
  image_credit: Hewholooks (CC BY-SA 3.0) via Wiki
  image_source_link: https://en.wikipedia.org/wiki/NGC%20663
  description_text: 'NGC 663 (also known as Caldwell 10) is a young open cluster located
    8,800 light years from Earth in the constellation of Cassiopeia. It has an estimated
    400 stars and spans about a quarter of a degree across the sky. It can reportedly
    be detected with the unaided eye, although a telescope is recommended for best
    viewing. The brightest members of the cluster can be viewed with binoculars. Although
    the listed visual magnitude is 7.1, several observers have reported higher estimates.

    Based on its parallax as measured by Gaia, it is located about 2,700 parsecs distant
    with an estimated age of 20–25 million years. This means that stars of spectral
    class B2 or higher (in the sense of higher mass), are reaching the end of their
    main sequence lifespan. This cluster appears to be located in front of a molecular
    cloud, although the two are not physically associated. This cloud has the effect
    of blocking background stars from the visual image of the cluster as it lies at
    a distance of 300 parsecs.

    This cluster is of interest because of the high number of Be stars, with a total
    of about 24 discovered. These are spectral class B stars that show prominent emission
    lines of hydrogen in their spectrum. Most of the Be stars in the cluster lie between
    spectral class B0 and B3. A candidate member of the cluster, LS I +61° 235, is
    a Be star with an X-ray binary component that has a period of about three years.
    There are at least five blue stragglers in the cluster. These are stars that formed
    by the merger of two other stars. Two of the cluster''s star systems are likely
    eclipsing binaries with periods of 0.6 and 1.03 days. NGC 663 also has two red
    supergiant stars, both located on its periphery

    The star cluster is assumed to form part of the stellar association Cassiopeia
    OB8, that is located in the Perseus Arm of the Milky Way, along with the open
    clusters M103, NGC 654, NGC 659, and some supergiant stars scattered between them,
    all of them having similar ages and distances. It is likely the most massive star
    cluster in the Cassiopeia OB8 association, and possibly the Perseus Arm.

    Recent ultraviolet observations from the AstroSat satellite revealed that many
    of the Be stars in NGC 663 have hot, compact helium-burning subdwarf OB (sdOB)
    companions, making up about 70% of the Be star population in the cluster. This
    discovery provides strong evidence that binary interactions, involving mass transfer
    and stripping of one star to form an sdOB companion, play a key role in the formation
    and evolution of Be stars in young clusters like NGC 663.'
  description_credit: Wikipedia
  description_source_link: https://en.wikipedia.org/wiki/NGC%20663

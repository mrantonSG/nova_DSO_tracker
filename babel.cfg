# Babel configuration for extracting translatable strings
# Usage: pybabel extract -F babel.cfg -o messages.pot --ignore-dirs="venv .venv .git instance static node_modules scratch" .
# Update: pybabel update -N -i translations/messages.pot -d translations
#   -N (--no-fuzzy-matching) is required: fuzzy matching copies msgstrs from similar-looking
#   msgids, which is how mistranslations slipped in. Run scripts/check_translations.py after.

[python: nova/**/*.py]
[python: modules/**/*.py]
[python: nova.py]
[jinja2: **/templates/**.html]

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nova-modal manual test</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/nova-theme.css">
    <link rel="stylesheet" href="css/nova-modal.css">
    <style>
        body { font-family: 'DM Sans', system-ui, sans-serif; padding: 32px; max-width: 640px; margin: 0 auto; background: var(--bg-primary); color: var(--text-primary); }
        h1 { font-size: 18px; }
        .row { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; }
        #result-log { margin-top: 24px; padding: 12px 16px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 8px; font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap; max-height: 240px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>nova-modal.js manual test harness</h1>
    <p>Not wired into the app. Click each button, resolve the dialog (confirm / cancel / overlay click / Escape), and check the log below matches the expected resolution.</p>

    <button id="theme-toggle-test" class="btn-secondary" type="button">Toggle dark mode</button>

    <div class="row">
        <button class="action-button" id="btn-confirm-basic">novaConfirm() basic</button>
        <button class="action-button" id="btn-confirm-titled">novaConfirm() with title</button>
        <button class="btn-danger" id="btn-confirm-danger">novaConfirm() danger</button>
        <button class="action-button" id="btn-confirm-labels">novaConfirm() custom labels</button>
        <button class="action-button" id="btn-alert-basic">novaAlert() basic</button>
        <button class="action-button" id="btn-alert-titled">novaAlert() with title</button>
        <button class="btn-secondary" id="btn-sequence">Fire two novaConfirm() back-to-back</button>
    </div>

    <div id="result-log"></div>

    <script src="js/modal-manager.js"></script>
    <script src="js/nova-modal.js"></script>
    <script>
        var log = document.getElementById('result-log');
        function report(label, value) {
            log.textContent = '[' + new Date().toLocaleTimeString() + '] ' + label + ' -> ' + JSON.stringify(value) + '\n' + log.textContent;
        }

        document.getElementById('theme-toggle-test').onclick = function () {
            var html = document.documentElement;
            html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        };

        document.getElementById('btn-confirm-basic').onclick = function () {
            novaConfirm('Are you sure you want to do this?').then(function (r) { report('confirm basic', r); });
        };
        document.getElementById('btn-confirm-titled').onclick = function () {
            novaConfirm('This will overwrite your current settings.', { title: 'Overwrite settings?' }).then(function (r) { report('confirm titled', r); });
        };
        document.getElementById('btn-confirm-danger').onclick = function () {
            novaConfirm('This action cannot be undone.', { title: 'Delete rig?', confirmLabel: 'Delete', danger: true }).then(function (r) { report('confirm danger', r); });
        };
        document.getElementById('btn-confirm-labels').onclick = function () {
            novaConfirm('Send this session to the cloud?', { confirmLabel: 'Send', cancelLabel: 'Not now' }).then(function (r) { report('confirm custom labels', r); });
        };
        document.getElementById('btn-alert-basic').onclick = function () {
            novaAlert('Saved successfully.').then(function (r) { report('alert basic', r); });
        };
        document.getElementById('btn-alert-titled').onclick = function () {
            novaAlert('Your changes could not be saved. Check your connection and try again.', { title: 'Save failed' }).then(function (r) { report('alert titled', r); });
        };
        document.getElementById('btn-sequence').onclick = function () {
            novaConfirm('First dialog (should be auto-dismissed as false)').then(function (r) { report('sequence: first', r); });
            novaConfirm('Second dialog (this one you actually answer)').then(function (r) { report('sequence: second', r); });
        };
    </script>
</body>
</html>
